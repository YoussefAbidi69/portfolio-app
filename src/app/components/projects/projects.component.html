<section id="projects" class="projects" appScrollReveal>
    <div class="container">
        <div class="proj-head">
            <app-section-heading
                [num]="'PROJECTS_SECTION.NUM' | translate"
                [title]="'PROJECTS_SECTION.TITLE' | translate">
            </app-section-heading>

            <div class="filters">
                <button
                    *ngFor="let f of filters"
                    class="filter"
                    [class.active]="active() === f.key"
                    (click)="setFilter(f.key)">
                    {{ f.i18n | translate }}
                </button>
            </div>
        </div>

        <div class="proj-grid">
            <article
                *ngFor="let p of visible(); trackBy: trackId"
                class="proj-card"
                [class.featured]="p.featured"
                [attr.data-cat]="p.category"
                appTilt>

                <!-- Cover -->
                <div class="p-cover">
                    <div class="p-cover-glow"></div>
                    <div class="p-cover-grid"></div>
                    <div class="p-cover-top">
                        <span *ngIf="p.featured" class="p-featured">
                            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            FEATURED
                        </span>
                        <span class="p-date">{{ formatDate(p.date) }}</span>
                    </div>
                    <div class="p-cover-bottom">
                        <span class="p-cat-pill">{{ p.category }}</span>
                        <span class="p-id">{{ p.id }}</span>
                    </div>
                </div>

                <!-- Body -->
                <div class="p-body">
                    <div class="p-body-top">
                        <h3 class="p-title">{{ p.title | translate }}</h3>
                        <div class="p-links">
                            <a *ngIf="p.links.github" [href]="p.links.github" target="_blank" class="p-link" aria-label="GitHub">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                                </svg>
                            </a>
                            <a *ngIf="p.links.demo" [href]="p.links.demo" target="_blank" class="p-link" aria-label="Demo">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                                </svg>
                            </a>
                        </div>
                    </div>

                    <p class="p-desc">{{ p.description | translate }}</p>

                    <div class="p-stack">
                        <app-tech-badge *ngFor="let t of p.stack" [name]="t"></app-tech-badge>
                    </div>
                </div>

            </article>

            <p *ngIf="visible().length === 0" class="p-empty">
                {{ 'PROJECTS_SECTION.EMPTY' | translate }}
            </p>
        </div>
    </div>
</section>
